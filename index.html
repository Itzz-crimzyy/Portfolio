<style>
:root{--bg:#070b16;--panel:#0e1526;--line:#1e2a45;--tx:#e6ecf7;--mut:#94a3bd;--ac:#3B82F6;--cy:#67e8f9;--grid:rgba(59,130,246,.08)}
:root[data-theme="light"]{--bg:#f4f7fc;--panel:#ffffff;--line:#cfd9ea;--tx:#0d1730;--mut:#4a5a78;--ac:#1d5fd6;--cy:#0e7490;--grid:rgba(29,95,214,.09)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background-color:var(--bg);color:var(--tx);font:16px/1.6 Inter,system-ui,sans-serif;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;line-height:1.15;margin:0}
a{color:var(--cy)}
:focus-visible{outline:2px solid var(--cy);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
section{padding:80px 0}
h2{font-size:clamp(1.7rem,4vw,2.4rem);margin-bottom:26px}
h3{font-size:1.1rem}
.mono,.tag,.label{font-family:'JetBrains Mono',monospace;font-size:.78rem}
.label{color:var(--cy);display:block;margin-bottom:6px}
.mut{color:var(--mut)}
nav{position:sticky;top:0;z-index:20;background:rgba(7,11,22,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
:root[data-theme="light"] nav{background:rgba(244,247,252,.85)}
nav .wrap{display:flex;align-items:center;gap:14px;height:56px}
nav b{font-family:'JetBrains Mono',monospace;color:var(--cy)}
nav ul{display:flex;gap:16px;list-style:none;margin:0 0 0 auto;padding:0;overflow-x:auto}
nav li a{color:var(--mut);text-decoration:none;font-size:.9rem;white-space:nowrap}
nav li a:hover{color:var(--tx)}
#theme{background:none;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 10px;cursor:pointer}
.hero{min-height:86vh;display:flex;align-items:center;position:relative;overflow:hidden;padding:60px 0 120px}
